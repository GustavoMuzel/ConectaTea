[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py
# Marcador desconhecido vira erro: um typo como @pytest.mark.unti não pode tirar um teste das duas checagens.
addopts = --strict-markers
markers =
    unit: teste unitário (sem banco e sem rede); roda com pytest -m unit
    integration: teste de integração (views, API, services e banco de teste); roda com pytest -m integration
