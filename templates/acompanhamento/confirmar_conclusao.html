{% extends "base.html" %}
{% block title %}Confirmar atividade{% endblock %}
{% block content %}
<div class="cartao mx-auto text-center" style="max-width: 30rem;">
  <h1 class="h4 mb-4">Você já terminou a atividade "{{ atividade.title }}"?</h1>
  <div class="d-grid gap-3">
    <form method="post" action="{% url 'concluir_atividade' atividade.pk %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary btn-lg w-100">Sim, terminei</button>
    </form>
    <a class="btn btn-outline-secondary btn-lg w-100" href="{% url 'aluno_atividades' %}">Não, voltar</a>
  </div>
</div>
{% endblock %}
