{% extends "base.html" %}
{% block title %}Editar anotação{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Editar anotação</h1>
<section class="cartao" aria-labelledby="titulo-editar">
  <h2 id="titulo-editar" class="visually-hidden">Formulário</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}{{ field.as_field_group }}{% endfor %}
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{{ view.get_success_url }}" class="btn btn-link">Cancelar</a>
  </form>
</section>
{% endblock %}
