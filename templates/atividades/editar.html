{% extends "base.html" %}
{% block title %}Editar atividade{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Editar atividade</h1>
<section class="cartao" aria-labelledby="titulo-editar">
  <h2 id="titulo-editar" class="h5 mb-3">{{ object.title }}</h2>
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include "partials/_atividade_campos.html" %}
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{% url 'painel' %}" class="btn btn-link">Cancelar</a>
  </form>
</section>
{% endblock %}
